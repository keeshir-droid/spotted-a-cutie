<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>cards test page</title>
<style>
  body { margin: 0; padding: 12px; background: #dcd6c8; font: 13px/1.4 system-ui, sans-serif; color: #1c2433; }
  h2 { font: 600 14px system-ui; margin: 14px 0 6px; }
  .row { display: flex; gap: 10px; flex-wrap: nowrap; align-items: flex-start; }
  figure { margin: 0; }
  figcaption { font-size: 11px; color: #3a4252; margin-top: 2px; }
  canvas { display: block; box-shadow: 0 1px 3px rgba(0,0,0,.3); }
  pre.timing { background: #fffdf8; padding: 8px; font-size: 12px; white-space: pre-wrap; }
  .txt { background: #fffdf8; padding: 10px; margin: 8px 0; font-size: 13px; white-space: pre-wrap; border-left: 4px solid #1f3a5f; }
  .err { color: #a33a2b; white-space: pre-wrap; }
</style>
</head>
<body>
<div id="out"></div>
<script src="../src/engine/util.js"></script>
<script src="../src/engine/palette.js"></script>
<script src="../src/engine/decode.js"></script>
<script src="../src/engine/content-data.js"></script>
<script src="../src/engine/content.js"></script>
<script src="../src/engine/photo.js"></script>
<script src="../src/engine/grade.js"></script>
<script src="../src/engine/art.js"></script>
<script src="../src/engine/text.js"></script>
<script src="../src/engine/styles.js"></script>
<script src="../src/engine/card.js"></script>
<script>
/* Dev shortcuts (PLAN.md section 7.4):
   ?set=real                      every photo in tests/real as 6 styles at scale 0.5, + pigeon zoom, golden row, personalised row, timings
   ?set=real&photo=06&style=trading&scale=1     one card full size (photo = the file's number prefix or name)
   &crop=tuned|auto  &zoom= &cx= &cy=  &kind=  &golden=1  &to=Priya&reason=twin  &seed=  &place=  &format=story  &number=  &w=<css px>  &rows=01,06
   ?set=content&n=20              20 random cards as plain text
   ?set=content&n=20&json=1       same, but as JSON on the page for scripts */
var Q = new URLSearchParams(location.search);
var out = document.getElementById("out");
var PHOTOS = [
  { file: "01-cat-scooter-mumbai.jpg", kind: "cat", tuned: { cx: 0.5, cy: 0.35, zoom: 1 } },
  { file: "02-cat-street-mumbai.jpg", kind: "cat", tuned: { cx: 0.62, cy: 0.45, zoom: 1.3 } },
  { file: "03-cat-tabby-west-bengal.jpg", kind: "cat", tuned: { cx: 0.5, cy: 0.4, zoom: 1.2 } },
  { file: "04-dog-sleeping.jpg", kind: "dog", tuned: { cx: 0.52, cy: 0.62, zoom: 1.8 } },
  { file: "05-dog-looking.jpg", kind: "dog", tuned: { cx: 0.5, cy: 0.55, zoom: 1.0 } },
  { file: "06-pigeon-balcony-taxila.jpg", kind: "pigeon", tuned: { cx: 0.45, cy: 0.70, zoom: 3 } },
  { file: "07-crow-flight-walls.jpg", kind: "crow", tuned: { cx: 0.68, cy: 0.5, zoom: 1.8 } },
  { file: "08-cow-street-madurai.jpg", kind: "cow", tuned: { cx: 0.6, cy: 0.55, zoom: 1.3 } }
];
var STYLES = SC.STYLES.map(function (s) { return s.id; });
var timings = [];

function el(tag, cls, html) { var e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }
function loadPhoto(file) {
  return new Promise(function (res, rej) {
    var img = new Image();
    img.onload = function () {
      var k = Math.min(1, 1600 / Math.max(img.naturalWidth, img.naturalHeight));
      var c = document.createElement("canvas"); c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
      var x = c.getContext("2d"); x.drawImage(img, 0, 0, c.width, c.height);
      res(SC.photo.from(x.getImageData(0, 0, c.width, c.height)));
    };
    img.onerror = function () { rej(new Error("cannot load " + file)); };
    img.src = "real/" + file;
  });
}
function pick(key) {
  if (!key) return null;
  return PHOTOS.filter(function (p) { return p.file.indexOf(key) === 0 || p.file === key; })[0] || null;
}
var cssW = +(Q.get("w") || 0);
function show(row, card, scale, caption, format) {
  var t0 = performance.now();
  var cv = card.render(scale, format || "card");
  var ms = performance.now() - t0;
  timings.push({ name: caption, ms: ms, scale: scale, cached: SC.card.lastTiming && SC.card.lastTiming.cached });
  var f = el("figure");
  var shown = document.createElement("canvas"); shown.width = cv.width; shown.height = cv.height;
  shown.getContext("2d").drawImage(cv, 0, 0);
  if (cssW) { shown.style.width = cssW + "px"; shown.style.height = (cssW * cv.height / cv.width) + "px"; }
  f.appendChild(shown); f.appendChild(el("figcaption", null, caption + " " + ms.toFixed(0) + " ms"));
  row.appendChild(f);
}
function settingsFor(p, photo, style, over) {
  var seed = +(Q.get("seed") || 0) || (p ? SC.util.hash(p.file) : 7);
  SC.content.resetSession();
  var traits = SC.content.generate(Q.get("kind") || (p && p.kind) || "cat", { seed: seed, memory: false });
  if (Q.get("name")) traits.name = Q.get("name");
  var crop = Q.get("zoom") ? { cx: +(Q.get("cx") || 0.5), cy: +(Q.get("cy") || 0.45), zoom: +Q.get("zoom") }
    : (Q.get("crop") === "tuned" && p ? p.tuned : SC.photo.autoCrop(photo));
  var o = {
    photo: photo, crop: crop, kind: Q.get("kind") || p.kind, traits: traits, style: style,
    golden: Q.get("golden") === "1", number: +(Q.get("number") || 14), place: Q.get("place") || "",
    to: Q.get("to") ? { name: Q.get("to"), reason: Q.get("reason") || "twin" } : null, when: Date.UTC(2026, 9, 9, 12), seed: seed
  };
  return Object.assign(o, over || {});
}

async function real() {
  await SC.text.ready();
  var single = pick(Q.get("photo"));
  var scale = +(Q.get("scale") || 0.5);
  var fmt = Q.get("format") === "story" ? "story" : "card";
  var loaded = {};
  async function get(p) { return loaded[p.file] || (loaded[p.file] = await loadPhoto(p.file)); }
  if (single) {
    var styles = Q.get("style") ? Q.get("style").split(",") : STYLES;
    var row = el("div", "row"); out.appendChild(row);
    var photo = await get(single);
    for (var i = 0; i < styles.length; i++) {
      var card = await SC.card.create(settingsFor(single, photo, styles[i]));
      show(row, card, scale, single.file.slice(0, 2) + " " + styles[i], fmt);
    }
  } else {
    var only = Q.get("rows") ? Q.get("rows").split(",") : null;
    var list = PHOTOS.filter(function (p) { return !only || only.indexOf(p.file.slice(0, 2)) >= 0; });
    var SEC = Q.get("sec") ? Q.get("sec").split(",") : ["photos", "pigeon", "golden", "personal", "timing"];
    var has = function (k) { return SEC.indexOf(k) >= 0; };
    for (var a = 0; has("photos") && a < list.length; a++) {
      var p = list[a], ph = await get(p);
      out.appendChild(el("h2", null, p.file + (Q.get("crop") === "tuned" ? " (tuned crop)" : " (auto crop)")));
      var r = el("div", "row"); out.appendChild(r);
      for (var b = 0; b < STYLES.length; b++) {
        var c = await SC.card.create(settingsFor(p, ph, STYLES[b]));
        show(r, c, scale, STYLES[b]);
      }
    }
    if (has("pigeon") && (!only || only.indexOf("06") >= 0)) {
      var pg = PHOTOS[5], pgp = await get(pg);
      out.appendChild(el("h2", null, "pigeon zoomed 3x on the bird"));
      var rz = el("div", "row"); out.appendChild(rz);
      for (var z = 0; z < STYLES.length; z++) {
        var cz = await SC.card.create(settingsFor(pg, pgp, STYLES[z], { crop: pg.tuned }));
        show(rz, cz, scale, "pigeon " + STYLES[z]);
      }
    }
    if (!only || only.indexOf("01") >= 0) {
      var gp = PHOTOS[0], gph = await get(gp);
      if (has("golden")) out.appendChild(el("h2", null, "golden row (cat on scooter)"));
      var rg = el("div", "row"); out.appendChild(rg);
      for (var g = 0; has("golden") && g < STYLES.length; g++) {
        var cg = await SC.card.create(settingsFor(gp, gph, STYLES[g], { golden: true, crop: gp.tuned }));
        show(rg, cg, scale, "golden " + STYLES[g]);
      }
      if (has("personal")) out.appendChild(el("h2", null, "personalised row: to=Priya reason=" + (Q.get("reason") || "twin")));
      var rp = el("div", "row"); out.appendChild(rp);
      for (var q = 0; has("personal") && q < STYLES.length; q++) {
        var cp = await SC.card.create(settingsFor(gp, gph, STYLES[q], { to: { name: Q.get("to") || "Priya", reason: Q.get("reason") || "twin" }, crop: gp.tuned }));
        show(rp, cp, scale, "to Priya " + STYLES[q]);
      }
      // timing of rerolls and style changes on one card, scale 0.5
      if (!has("timing")) { window.__done = true; return; }
      var tc = await SC.card.create(settingsFor(gp, gph, "trading", { crop: gp.tuned }));
      var tt = [];
      tc.render(0.5, "card");
      var t0 = performance.now(), tr;
      for (var i2 = 0; i2 < 6; i2++) {
        tr = SC.content.reroll(tc.settings.traits, "all", { kind: "cat", memory: false });
        await tc.update({ traits: tr });
        var s0 = performance.now(); tc.render(0.5, "card"); tt.push(performance.now() - s0);
      }
      var rerollMs = tt.reduce(function (a, b) { return a + b; }, 0) / tt.length;
      var sc = [];
      for (var si = 0; si < STYLES.length * 2; si++) {
        await tc.update({ style: STYLES[si % 6] });
        var u0 = performance.now(); tc.render(0.5, "card"); sc.push(performance.now() - u0);
      }
      var cold = sc.slice(0, 6), warm = sc.slice(6);
      var s1 = performance.now(); tc.render(1, "card"); var fullMs = performance.now() - s1;
      var s2 = performance.now(); tc.render(1, "story"); var storyMs = performance.now() - s2;
      var avg = function (x) { return (x.reduce(function (a, b) { return a + b; }, 0) / x.length).toFixed(0); };
      var pre = el("pre", "timing",
        "TIMINGS (this PC, headless Edge)\n" +
        "text reroll, scale 0.5 (graded photo + art cached): avg " + rerollMs.toFixed(0) + " ms\n" +
        "style change, scale 0.5, first visit of each style: avg " + avg(cold) + " ms, max " + Math.max.apply(null, cold).toFixed(0) + " ms\n" +
        "style change, scale 0.5, second visit (caches warm): avg " + avg(warm) + " ms\n" +
        "full size 1080x1350 (trading): " + fullMs.toFixed(0) + " ms,  story 1080x1920: " + storyMs.toFixed(0) + " ms");
      out.appendChild(pre);
      window.__timings = { reroll: rerollMs, styleCold: avg(cold), styleWarm: avg(warm), full: fullMs, story: storyMs };
    }
  }
  window.__done = true;
}

async function content() {
  var n = +(Q.get("n") || 20);
  var kinds = SC.KINDS.map(function (k) { return k.id; });
  var seed0 = +(Q.get("seed") || 2026);
  SC.content.resetSession();
  var locale = Q.get("locale") || navigator.language;
  var r = SC.util.mulberry32(seed0), cards = [];
  for (var i = 0; i < n; i++) {
    var kind = kinds[Math.floor(r() * kinds.length)];
    var t = SC.content.generate(kind, { seed: Math.floor(r() * 4294967296), locale: locale });
    var reason = SC.REASONS[i % 8].id, style = STYLES[i % 6];
    var ctx = { name: t.name, kind: kind, place: "on a scooter seat", to: "Priya" };
    var lines = [(i + 1) + ". " + t.name + ", " + t.age + " (" + kind + ")", "   Title: " + t.title];
    SC.content.FIELDS.forEach(function (f) { if (f.id !== "name" && f.id !== "title") lines.push("   " + f.label + ": " + SC.content.fill(t[f.id], ctx)); });
    lines.push("   Stats: CHAOS " + t.stats.chaos + " / FLUFF " + t.stats.fluff + " / SASS " + t.stats.sass);
    t.moves.forEach(function (m) { lines.push("   Move: " + m.name + " (" + m.damage + "): " + m.text); });
    lines.push("   Recipient (" + style + ", " + reason + "): " + SC.content.recipientLine(style, reason, ctx));
    cards.push(lines.join("\n"));
    out.appendChild(el("div", "txt")).textContent = lines.join("\n");
  }
  window.__cards = cards; window.__done = true;
}

/* set=fit: stress every style with the longest lines of content-data.js and a 32-character place.
   SC.text.draw is wrapped so every draw call is measured: width must stay inside its box (+1 px) and the
   text must never be cut without an ellipsis. Prints OK or the list of violations. */
async function fitcheck() {
  await SC.text.ready();
  var viol = [], calls = 0, orig = SC.text.draw;
  SC.text.draw = function (c, str, slot, ov) {
    var o = ov ? Object.assign({}, slot, ov) : slot;
    var r = orig.apply(this, arguments); calls++;
    if (o.w && r.widths) r.widths.forEach(function (w, i) {
      if (w > o.w + 1) viol.push("too wide: " + JSON.stringify(r.lines[i]) + " " + w.toFixed(0) + " > " + o.w);
    });
    if (o.w && o.lines === 1 && r.lines.length > 1) viol.push("lines: " + str);
    r.lines.forEach(function (ln) { if (/…$/.test(ln) && /alexandr/i.test(String(str)) && !/…$/.test(String(str))) viol.push("name/recipient cut with an ellipsis: " + ln); });
    return r;
  };
  var D = SC.CONTENT_DATA, ph = await loadPhoto(PHOTOS[0].file);
  function longest(list) { return list.slice().sort(function (a, b) { return b.length - a.length; })[0]; }
  var place = "on the warmest car bonnet in town, near the bakery";   // longer than 32: clipped at a word   // 32 characters
  var pcount = 0;
  for (var ki = 0; ki < SC.KINDS.length; ki++) {
    var kind = SC.KINDS[ki].id, kd = D.kinds[kind];
    var t = SC.content.generate(kind, { seed: 5, memory: false });
    SC.content.LIST_FIELDS.forEach(function (f) {
      var pool = (kd[f] || []).concat(D.shared[f] || []);
      if (pool.length) t[f] = SC.content.fill(longest(pool), { name: "Professor Monty", kind: kind });
    });
    t.name = longest(D.names.human.concat(kd.names)).length > 12 ? longest(D.names.human.concat(kd.names)) : "Professor Montgomery";
    t.moves = [kd.moves.slice().sort(function (a, b) { return (b.name + b.text).length - (a.name + a.text).length; })[0], kd.moves[0]];
    var c = await SC.card.create({ photo: ph, kind: kind, traits: t, style: "minimal", golden: false, number: 1234, place: "", seed: 9 });
    for (var si = 0; si < STYLES.length; si++) for (var gi = 0; gi < 2; gi++) for (var pi = 0; pi < 2; pi++) {
      var reason = SC.REASONS.map(function (r) { return r.id; })[(ki + si + pi) % 8];
      await c.update({ style: STYLES[si], golden: !!gi, place: pi ? place : "", to: pi ? { name: "Alexandrina Rose", reason: reason } : null });
      c.render(0.5, "card"); pcount++;
    }
  }
  SC.text.draw = orig;
  var uniq = viol.filter(function (v, i) { return viol.indexOf(v) === i; });
  out.appendChild(el("pre", uniq.length ? "err" : "timing", (uniq.length ? "VIOLATIONS (" + uniq.length + ")\n" + uniq.slice(0, 40).join("\n") : "FIT OK") + "\n" + pcount + " cards, " + calls + " text draws"));
  window.__fit = uniq; window.__done = true;
}
async function autocrop() {
  await SC.text.ready();
  var old = { cx: 0.5, cy: 0.45, zoom: 1.15 };
  for (var i = 0; i < PHOTOS.length; i++) {
    var p = PHOTOS[i], ph = await loadPhoto(p.file);
    var t0 = performance.now(), ac = SC.photo.autoCrop(ph), ms = performance.now() - t0;
    out.appendChild(el("h2", null, p.file + "  new crop " + JSON.stringify(ac, function (k, v) { return typeof v === "number" ? Math.round(v * 1000) / 1000 : v; }) + "  (" + ms.toFixed(1) + " ms)"));
    var row = el("div", "row"); out.appendChild(row);
    var cols = [["trading", old, "before"], ["trading", ac, "after"], ["minimal", old, "before"], ["minimal", ac, "after"], ["polaroid", old, "before"], ["polaroid", ac, "after"]];
    for (var j = 0; j < cols.length; j++) {
      var c = await SC.card.create(settingsFor(p, ph, cols[j][0], { crop: cols[j][1] }));
      show(row, c, 0.5, cols[j][2] + " " + cols[j][0]);
    }
  }
  window.__done = true;
}
(Q.get("set") === "content" ? content() : Q.get("set") === "autocrop" ? autocrop() : Q.get("set") === "fit" ? fitcheck() : real()).catch(function (e) {
  out.appendChild(el("pre", "err")).textContent = (e && e.stack) || String(e); window.__done = true;
});
</script>
</body>
</html>
